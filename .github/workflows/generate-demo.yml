name: Generate fictional demo

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "src/generate_demo.py"
      - "src/aggregate.py"
      - "src/dashboard.py"
      - "src/github_api.py"
      - "src/render.py"
      - "src/snapshots.py"
      - "src/storage.py"
      - "requirements.txt"
      - ".github/workflows/generate-demo.yml"

permissions:
  contents: write

concurrency:
  group: github-traffic-demo-${{ github.repository }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate fictional archive

    # The demo belongs only to the original public template.
    # Repositories created from the template will skip this workflow.
    if: github.repository == 'ascheriit-dkp/github-traffic-archive-template'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate fictional demo
        run: python -m src.generate_demo

      - name: Validate generated demo
        shell: bash
        run: |
          set -euo pipefail

          test -f docs/demo/README.md

          test -f docs/demo/charts/total-views.svg
          test -f docs/demo/charts/total-unique-views.svg
          test -f docs/demo/charts/total-clones.svg
          test -f docs/demo/charts/total-unique-clones.svg

          test -f docs/demo/data/repos/atlas-docs/README.md
          test -f docs/demo/data/repos/atlas-docs/traffic.csv

          test -f docs/demo/data/repos/release-radar/README.md
          test -f docs/demo/data/repos/release-radar/traffic.csv

          test -f docs/demo/data/repos/tiny-cli/README.md
          test -f docs/demo/data/repos/tiny-cli/traffic.csv

          grep -q "Generated Demo" docs/demo/README.md
          grep -q "fictional" docs/demo/README.md

          echo "The generated demo passed validation."

      - name: Commit generated demo
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- docs/demo

          if git diff --cached --quiet; then
            echo "The fictional demo is already current."
          else
            git commit -m "Generate fictional traffic demo"
            git push
          fi
