name: Collect GitHub traffic

on:
  workflow_dispatch:

  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: github-traffic-archive-${{ github.repository }}
  cancel-in-progress: false

jobs:
  collect:
    name: Collect repository traffic

    # Prevent the public template itself from collecting data.
    if: github.repository != 'ascheriit-dkp/github-traffic-archive-template'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out archive repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect traffic data
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python -m src.collect

      - name: Commit collected data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- README.md

          if [ -e data ]; then
            git add -A -- data
          fi

          if [ -e charts ]; then
            git add -A -- charts
          fi

          if git diff --cached --quiet; then
            echo "No stored traffic data changed."
          else
            git commit -m "Update GitHub traffic data"
            git push
          fi
